<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Vibe Halo Settings</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Settings navigation">
      <div class="sidebar-drag"></div>
      <div class="brand">
        <div class="halo-mark" aria-hidden="true"><span></span></div>
        <div class="brand-copy">
          <strong>Vibe Halo</strong>
          <span id="brand-version"></span>
        </div>
      </div>
      <nav class="nav-top" aria-label="Pages">
        <button class="nav-item" type="button" data-page="general">
          <span class="nav-icon" data-icon="gear" aria-hidden="true"></span>
          <span class="nav-label" data-label="general">General</span>
        </button>
        <button class="nav-item" type="button" data-page="history">
          <span class="nav-icon" data-icon="clock" aria-hidden="true"></span>
          <span class="nav-label" data-label="recentEvents">Recent events</span>
          <span class="nav-count" id="history-count"></span>
        </button>
        <button class="nav-item" type="button" data-page="mobile">
          <span class="nav-icon" data-icon="phone" aria-hidden="true"></span>
          <span class="nav-label" data-label="mobileCompanion">Mobile companion</span>
          <span class="status-dot" id="mobile-dot" aria-hidden="true"></span>
        </button>
      </nav>
      <div class="nav-group-title" id="clients-title"><span data-label="clients">Clients</span></div>
      <nav id="client-nav" class="client-nav" aria-label="Clients"></nav>
    </aside>
    <main class="content">
      <div class="content-drag"></div>
      <div id="scroller" class="scroller">
        <div id="page" class="page" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="./renderer.js"></script>
</body>
</html>
