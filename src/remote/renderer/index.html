<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Vibe Halo · 手机伴侣</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="eyebrow">VIBE HALO</span><h1>手机伴侣</h1><p>连接手机，查看通知和处理请求。</p></header>
<p id="message" role="status" aria-live="polite"></p>
<section><div class="heading"><h2>这台电脑</h2><span id="status" class="badge">未开启</span></div>
<form id="nameForm"><label for="deviceName">电脑名称</label><input id="deviceName" type="text" autocomplete="off"><button type="submit">保存名称</button><button id="resetName" type="button" class="secondary">恢复系统名称</button><p id="nameStatus" class="hint"></p></form>
<form id="setup"><p>正在自动连接手机伴侣服务，连接后即可配对手机。</p>
<button id="retry" type="submit">重新连接</button></form>
<div id="configured" hidden><p id="service"></p><p id="lan"></p><button id="toggle" type="button">关闭手机伴侣</button>
<label class="switch"><input id="control" type="checkbox">允许手机提交审批和精确回答</label><p class="hint">默认关闭。长期授权还需单独授予权限并在手机核对完整范围。通知上不会出现批准按钮。</p><button id="testNotification" type="button" class="secondary">发送测试提醒</button></div></section>
<section id="pairSection" hidden><div class="heading"><h2>连接手机</h2><button id="pair" type="button" class="secondary">生成配对码</button></div>
<label class="switch"><input id="readOnly" type="checkbox">只读配对（仅查看事件和历史）</label>
<label class="switch"><input id="persistent" type="checkbox">允许此手机在核对完整范围后提交长期授权</label>
<div id="pairing" hidden><p>在 Android 应用输入下方配对码，有效期 5 分钟。</p><output id="code" class="code"></output>
<p id="phone"></p><output id="fingerprint" class="fingerprint"></output><p id="compare" hidden>请与手机上显示的指纹逐字核对，一致后确认。</p>
<button id="confirm" type="button" hidden>指纹一致，确认连接</button><button id="cancelPair" type="button" class="secondary">取消配对</button></div></section>
<section><h2>已连接设备</h2><div id="devices"><p class="hint">还没有连接的手机。</p></div></section>
<footer>私钥保存在系统安全存储中。关闭此功能不会影响电脑原有的审批流程。</footer></main><script src="strings.js"></script><script src="app.js"></script></body></html>
